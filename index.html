а<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Supabase и Firebase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{аа  .switch button{
    font:inherit; font-weight:600; border:0; background:transparent; color:var(--muted);
    padding:11px 8px; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .switch button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .dot{width:10px; height:10px; border-radius:50%}
  .dot.sb{background:var(--sb)} .dot.fb{background:var(--fb)}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px}
  .providers{display:grid; gap:10px}
  .prov{
    font:inherit; font-weight:600; font-size:1rem; width:100%;
    display:flex; align-items:center; gap:14px; padding:13px 16px;
    background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:12px; cursor:pointer;
  }
  .prov:hover{border-color:var(--ink)}
  .prov svg{width:22px; height:22px; flex:none}
  .prov.apple{background:#000; color:#fff; border-color:#000}
  :focus-visible{outline:3px solid var(--ink); outline-offset:2px}

  .user{display:grid; gap:16px}
  .who{display:flex; align-items:center; gap:14px}
  .avatar{width:56px; height:56px; border-radius:50%; background:var(--line); object-fit:cover; flex:none;
    display:grid; place-items:center; font-weight:800; font-size:1.3rem}
  .name{font-weight:800; font-size:1.2rem; line-height:1.2; overflow-wrap:anywhere}
  .mail{color:var(--muted); font-size:.95rem; overflow-wrap:anywhere}
  .meta{font-size:.9rem; color:var(--muted); border-top:1px solid var(--line); padding-top:12px}
  .logout{
    font:inherit; font-weight:600; padding:13px 16px; border-radius:12px; cursor:pointer;
    background:var(--ink); color:#fff; border:0;
  }
  .logout:hover{background:#000}

  .msg{min-height:1.4em; margin:14px 2px 0; font-size:.92rem; color:var(--danger)}
  .msg.ok{color:var(--sb)}
  .notes{border-top:1px solid var(--line); padding-top:14px; display:grid; gap:10px}
  .notes h2{font-size:1.05rem; margin:0}
  .add{display:flex; gap:8px}
  .add input{flex:1; min-width:0; font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink)}
  .add button{font:inherit; font-weight:600; padding:0 16px; border-radius:10px; border:0; background:var(--ink); color:#fff; cursor:pointer}
  .list{list-style:none; margin:0; padding:0; display:grid; gap:8px}
  .list li{display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; overflow-wrap:anywhere}
  .list li button{font:inherit; border:0; background:transparent; color:var(--danger); cursor:pointer; font-weight:600}
  .empty{color:var(--muted); font-size:.92rem}
  .hidden{display:none !important}
  @media (prefers-reduced-motion:no-preference){ .prov,.logout,.switch button{transition:background .15s,border-color .15s} }
</style>
</head>
<body>
<main>
  <h1>Войти в аккаунт</h1>
  <p class="lead">Выберите, через какой сервис работает вход, и способ входа.</p>

  <div class="switch" role="group" aria-label="Сервис авторизации">
    <button id="tab-supabase" aria-pressed="true"><span class="dot sb"></span>Supabase</button>
    <button id="tab-firebase" aria-pressed="false"><span class="dot fb"></span>Firebase</button>
  </div>

  <section class="panel">
    <div id="signedOut" class="providers">
      <button class="prov" data-provider="google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>
        Войти через Google (Gmail)
      </button>
      <button class="prov" data-provider="github">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.700.5.500 5.700.5 12c0 5.100 3.300 9.400 7.900 10.900.6.100.8-.3.8-.6v-2c-3.200.7-3.900-1.500-3.900-1.500-.5-1.300-1.300-1.700-1.300-1.700-1-.7.100-.7.100-.7 1.200.1 1.800 1.200 1.800 1.200 1 1.800 2.800 1.300 3.400 1 .1-.8.4-1.300.7-1.600-2.600-.3-5.300-1.300-5.300-5.700 0-1.300.5-2.300 1.200-3.100-.1-.3-.5-1.500.1-3.100 0 0 1-.3 3.200 1.200a11 11 0 0 1 5.800 0C17.200 5.200 18.200 5.500 18.200 5.500c.6 1.600.2 2.800.1 3.100.8.800 1.200 1.800 1.200 3.100 0 4.400-2.700 5.400-5.300 5.700.4.400.8 1.100.8 2.200v3.300c0 .3.2.7.8.6A11.500 11.500 0 0 0 23.500 12C23.500 5.700 18.300.5 12 .5z"/></svg>
        Войти через GitHub
      </button>
      <button class="prov apple" data-provider="apple">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.400 12.700c0-2.400 2-3.500 2.100-3.600-1.200-1.700-3-1.900-3.600-2-1.500-.2-3 .9-3.800.9-.8 0-2-.9-3.300-.9-1.700 0-3.300 1-4.200 2.500-1.800 3.100-.5 7.700 1.300 10.200.9 1.200 1.900 2.600 3.200 2.500 1.300-.1 1.800-.8 3.300-.8s2 .8 3.300.8c1.400 0 2.300-1.200 3.100-2.500 1-1.400 1.400-2.800 1.400-2.900-.1 0-2.800-1.100-2.800-4.200zM13.900 5.300c.7-.9 1.200-2.100 1-3.300-1 0-2.300.7-3 1.600-.7.800-1.200 2-1.100 3.200 1.200.1 2.400-.6 3.100-1.500z"/></svg>
        Войти через Apple
      </button>
    </div>

    <div id="signedIn" class="user hidden">
      <div class="who">
        <img id="avatar" class="avatar hidden" alt="">
        <div id="avatarFallback" class="avatar" aria-hidden="true">?</div>
        <div>
          <div class="name" id="userName"></div>
          <div class="mail" id="userEmail"></div>
        </div>
      </div>
      <div class="meta" id="userMeta"></div>
      <div class="notes">
        <h2>Мои заметки (хранятся в базе данных)</h2>
        <form class="add" id="addForm">
          <input id="noteText" type="text" maxlength="300" placeholder="Новая заметка" aria-label="Новая заметка" required>
          <button type="submit">Добавить</button>
        </form>
        <ul class="list" id="noteList"></ul>
        <div class="empty hidden" id="noteEmpty">Пока нет заметок.</div>
      </div>
      <button class="logout" id="logout">Выйти</button>
    </div>
  </section>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<script type="module">
/* ============================================================
   1. НАСТРОЙКИ — подставьте свои значения
   ============================================================ */
const SUPABASE_URL      = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-SUPABASE-ANON-KEY";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAsbYDxbTMNdcQjrUI9_O6MNv9-vwjSNIc",
  authDomain: "psina-687b9.firebaseapp.com",
  projectId: "psina-687b9",
  appId: "1:117680586779:web:40adbc82306159f584b8be"
};

/* ============================================================
   2. ИМПОРТЫ
   ============================================================ */
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signOut as fbSignOut, signInWithPopup,
  GoogleAuthProvider, GithubAuthProvider, OAuthProvider
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ============================================================
   3. ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const fbApp    = initializeApp(FIREBASE_CONFIG);
const fbAuth   = getAuth(fbApp);
const db       = getFirestore(fbApp);

const $ = id => document.getElementById(id);
const msg = (text, ok=false) => { $("msg").textContent = text || ""; $("msg").className = "msg" + (ok ? " ok" : ""); };

let backend = localStorage.getItem("auth-backend") || "supabase";
const state = { supabase: null, firebase: null };   // текущий пользователь в каждом сервисе

/* ============================================================
   4. ВХОД
   ============================================================ */
async function signIn(provider) {
  msg("");
  try {
    if (backend === "supabase") {
      const { error } = await supabase.auth.signInWithOAuth({
        provider,                                   // 'google' | 'github' | 'apple'
        options: { redirectTo: location.origin + location.pathname }
      });
      if (error) throw error;                       // дальше произойдёт редирект
    } else {
      const p = provider === "google" ? new GoogleAuthProvider()
              : provider === "github" ? new GithubAuthProvider()
              : new OAuthProvider("apple.com");
      await signInWithPopup(fbAuth, p);
    }
  } catch (e) {
    msg(e.message || String(e));
  }
}

/* ============================================================
   5. ВЫХОД
   ============================================================ */
async function logout() {
  msg("");
  try {
    if (backend === "supabase") {
      const { error } = await supabase.auth.signOut();
      if (error) throw error;
    } else {
      await fbSignOut(fbAuth);
    }
    msg("Вы вышли из аккаунта.", true);
  } catch (e) {
    msg(e.message || String(e));
  }
}

/* ============================================================
   6. ОТОБРАЖЕНИЕ
   ============================================================ */
function normalize(u, source) {
  if (!u) return null;
  if (source === "supabase") {
    const m = u.user_metadata || {};
    return { id: u.id, name: m.full_name || m.name || m.user_name || "Без имени", email: u.email || "",
             photo: m.avatar_url || m.picture || "", provider: (u.app_metadata && u.app_metadata.provider) || "" };
  }
  return { id: u.uid, name: u.displayName || "Без имени", email: u.email || "", photo: u.photoURL || "",
           provider: (u.providerData[0] && u.providerData[0].providerId || "").replace(".com","") };
}

/* ============================================================
   БАЗА ДАННЫХ: заметки пользователя
   Supabase  -> таблица public.notes
   Firebase  -> Firestore: users/{uid}/notes
   ============================================================ */
let unsubNotes = null, lastKey = "";

function renderNotes(items) {
  const ul = $("noteList"); ul.textContent = "";
  items.forEach(n => {
    const li = document.createElement("li");
    const t = document.createElement("span"); t.textContent = n.text;
    const b = document.createElement("button"); b.type = "button"; b.textContent = "Удалить";
    b.addEventListener("click", () => deleteNote(n.id));
    li.append(t, b); ul.append(li);
  });
  $("noteEmpty").classList.toggle("hidden", items.length > 0);
}

async function loadNotes() {
  if (unsubNotes) { unsubNotes(); unsubNotes = null; }
  const u = state[backend];
  if (!u) { renderNotes([]); return; }
  try {
    if (backend === "supabase") {
      const { data, error } = await supabase.from("notes").select("id,text").order("created_at", { ascending: false });
      if (error) throw error;
      renderNotes(data);
    } else {
      const q = query(collection(db, "users", u.id, "notes"), orderBy("createdAt", "desc"));
      unsubNotes = onSnapshot(q,
        snap => renderNotes(snap.docs.map(d => ({ id: d.id, text: d.data().text }))),
        e => msg(e.message));
    }
  } catch (e) { msg(e.message || String(e)); }
}

async function addNote(text) {
  const u = state[backend]; if (!u) return;
  try {
    if (backend === "supabase") {
      const { error } = await supabase.from("notes").insert({ text });
      if (error) throw error;
      await loadNotes();
    } else {
      await addDoc(collection(db, "users", u.id, "notes"), { text, createdAt: serverTimestamp() });
    }
  } catch (e) { msg(e.message || String(e)); }
}

async function deleteNote(id) {
  const u = state[backend]; if (!u) return;
  try {
    if (backend === "supabase") {
      const { error } = await supabase.from("notes").delete().eq("id", id);
      if (error) throw error;
      await loadNotes();
    } else {
      await deleteDoc(doc(db, "users", u.id, "notes", id));
    }
  } catch (e) { msg(e.message || String(e)); }
}

function render() {
  $("tab-supabase").setAttribute("aria-pressed", backend === "supabase");
  $("tab-firebase").setAttribute("aria-pressed", backend === "firebase");
  const u = state[backend];
  $("signedOut").classList.toggle("hidden", !!u);
  $("signedIn").classList.toggle("hidden", !u);
  const key = backend + ":" + (u ? u.id : "-");
  if (key !== lastKey) { lastKey = key; loadNotes(); }
  if (!u) return;
  $("userName").textContent  = u.name;
  $("userEmail").textContent = u.email;
  $("userMeta").textContent  = "Вход выполнен через " + (backend === "supabase" ? "Supabase" : "Firebase") +
                               (u.provider ? " · " + u.provider : "");
  $("avatarFallback").textContent = (u.name || "?").trim().charAt(0).toUpperCase();
  const img = $("avatar");
  if (u.photo) { img.src = u.photo; img.classList.remove("hidden"); $("avatarFallback").classList.add("hidden"); }
  else         { img.classList.add("hidden"); $("avatarFallback").classList.remove("hidden"); }
}

/* ============================================================
   7. СЛУШАТЕЛИ
   ============================================================ */
document.querySelectorAll(".prov").forEach(b => b.addEventListener("click", () => signIn(b.dataset.provider)));
$("logout").addEventListener("click", logout);
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const input = $("noteText"), text = input.value.trim();
  if (!text) return;
  input.value = "";
  await addNote(text);
});
for (const name of ["supabase", "firebase"]) {
  $("tab-" + name).addEventListener("click", () => {
    backend = name; localStorage.setItem("auth-backend", name); msg(""); render();
  });
}

supabase.auth.getSession().then(({ data }) => { state.supabase = normalize(data.session && data.session.user, "supabase"); render(); });
supabase.auth.onAuthStateChange((_e, session) => { state.supabase = normalize(session && session.user, "supabase"); render(); });
onAuthStateChanged(fbAuth, u => { state.firebase = normalize(u, "firebase"); render(); });

render();
</script>
</body>
</html>
