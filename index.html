<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход для героев</title>
<link rel="icon" href="/images/file.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1A44; --navy-deep:#050E2A; --red:#B3132B; --ivory:#F5F1E6; --gold:#D9A92B; --gold-dark:#A87B12;
  --ink:#0A1A44; --muted:#4F5B7A; --line:#D8D2BF;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:var(--ivory);
  font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(900px 500px at 50% -10%, #1B3A8A 0%, transparent 70%),
    linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
  background-attachment:fixed;
  display:grid; place-items:center; padding:64px 20px;
}
.stripes{
  position:fixed; left:0; right:0; height:16px; z-index:5;
  background:repeating-linear-gradient(90deg,var(--red) 0 32px,var(--ivory) 32px 64px);
}
.stripes.top{top:0} .stripes.bottom{bottom:0}
main{width:100%; max-width:460px; position:relative}

.hero{position:relative; margin-bottom:26px; isolation:isolate}
.hero::before{
  content:""; position:absolute; z-index:-1; width:230px; height:230px; right:-30px; top:-70px;
  background:linear-gradient(145deg,var(--gold),var(--gold-dark)); opacity:.22;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
h1{
  margin:0 0 10px; font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  font-weight:900; text-transform:uppercase; letter-spacing:.01em;
  font-size:clamp(3rem,13vw,4.6rem); line-height:.92;
  text-shadow:3px 3px 0 var(--red);
}
.lead{margin:0; color:#C9D2EC; line-height:1.5; max-width:34ch}

.panel{
  background:var(--ivory); color:var(--ink); border:3px solid var(--gold); border-radius:6px; padding:22px;
  box-shadow:0 0 0 6px var(--navy-deep), 0 24px 60px rgba(0,0,0,.55);
}
.providers{display:grid; gap:12px}
.prov{
  font:inherit; font-weight:700; font-size:1rem; width:100%; text-align:left;
  display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;
  background:#fff; color:var(--ink); border:2px solid var(--ink); border-radius:4px;
}
.prov:hover{border-color:var(--red); box-shadow:4px 4px 0 var(--red); transform:translate(-2px,-2px)}
.prov:active{transform:none; box-shadow:none}
.prov svg{width:22px; height:22px; flex:none}
.prov.apple{background:#000; color:#fff; border-color:#000}
.prov.apple:hover{border-color:var(--red)}
:focus-visible{outline:3px solid var(--gold-dark); outline-offset:3px}

.user{display:grid; gap:18px}
.who{display:flex; align-items:center; gap:14px}
.avatar{
  width:64px; height:64px; border-radius:50%; flex:none; object-fit:cover; background:var(--navy); color:var(--gold);
  border:3px solid var(--gold); display:grid; place-items:center;
  font-family:"Big Shoulders Display",Impact,sans-serif; font-weight:900; font-size:1.9rem;
}
.name{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif; font-weight:800; font-size:1.7rem; line-height:1.05; text-transform:uppercase; overflow-wrap:anywhere}
.mail{color:var(--muted); font-size:.95rem; overflow-wrap:anywhere}
.meta{font-size:.9rem; color:var(--muted); border-top:2px solid var(--line); padding-top:12px}

.notes{border-top:2px solid var(--line); padding-top:16px; display:grid; gap:12px}
.notes h2{margin:0; font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif; font-weight:800; font-size:1.35rem; text-transform:uppercase}
.add{display:flex; gap:8px}
.add input{flex:1; min-width:0; font:inherit; padding:11px 12px; border:2px solid var(--ink); border-radius:4px; background:#fff; color:var(--ink)}
.add button{font:inherit; font-weight:700; padding:0 18px; border-radius:4px; border:2px solid var(--gold-dark); background:var(--gold); color:var(--navy-deep); cursor:pointer}
.add button:hover{background:#E8BC48}
.list{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.list li{display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border:1px solid var(--line); border-left:5px solid var(--red); border-radius:4px; padding:10px 12px; overflow-wrap:anywhere}
.list li button{font:inherit; border:0; background:transparent; color:var(--red); cursor:pointer; font-weight:700}
.empty{color:var(--muted); font-size:.92rem}
.logout{font:inherit; font-weight:700; padding:14px 16px; border-radius:4px; cursor:pointer; background:var(--red); color:#fff; border:2px solid #7E0D1E}
.logout:hover{background:#C9182F}

.msg{min-height:1.4em; margin:16px 2px 0; font-size:.95rem; color:#FF9C9C; font-weight:600}
.msg.ok{color:var(--gold)}
.hidden{display:none !important}
@media (prefers-reduced-motion:no-preference){ .prov{transition:transform .12s,box-shadow .12s,border-color .12s} }
</style>
</head>
<body>
<div class="stripes top" aria-hidden="true"></div>
<div class="stripes bottom" aria-hidden="true"></div>
<main>
  <header class="hero">
    <h1>Вход для героев</h1>
    <p class="lead">Выберите, как войти, и откройте свои заметки.</p>
  </header>

  <section class="panel">
    <div id="signedOut" class="providers">
      <button class="prov" data-provider="google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>
        Войти через Google (Gmail)
      </button>
      <button class="prov" data-provider="github">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.700.5.500 5.700.5 12c0 5.100 3.300 9.400 7.900 10.900.6.100.8-.3.8-.6v-2c-3.200.7-3.900-1.500-3.900-1.500-.5-1.300-1.300-1.700-1.300-1.700-1-.7.100-.7.100-.7 1.200.1 1.800 1.200 1.800 1.200 1 1.800 2.800 1.300 3.400 1 .1-.8.4-1.300.7-1.600-2.600-.3-5.300-1.300-5.300-5.700 0-1.300.5-2.300 1.200-3.100-.1-.3-.5-1.500.1-3.100 0 0 1-.3 3.200 1.200a11 11 0 0 1 5.800 0C17.200 5.200 18.200 5.500 18.200 5.500c.6 1.600.2 2.800.1 3.100.8.800 1.200 1.800 1.200 3.100 0 4.400-2.700 5.400-5.300 5.700.4.400.8 1.100.8 2.200v3.300c0 .3.2.7.8.6A11.500 11.500 0 0 0 23.500 12C23.500 5.700 18.300.5 12 .5z"/></svg>
        Войти через GitHub
      </button>
      <button class="prov apple" data-provider="apple">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.400 12.700c0-2.400 2-3.500 2.100-3.600-1.200-1.700-3-1.900-3.600-2-1.500-.2-3 .9-3.800.9-.8 0-2-.9-3.300-.9-1.700 0-3.300 1-4.200 2.500-1.800 3.100-.5 7.700 1.300 10.200.9 1.200 1.900 2.600 3.200 2.500 1.300-.1 1.800-.8 3.300-.8s2 .8 3.300.8c1.400 0 2.300-1.200 3.100-2.500 1-1.400 1.400-2.800 1.400-2.900-.1 0-2.800-1.100-2.800-4.200zM13.900 5.300c.7-.9 1.200-2.100 1-3.300-1 0-2.300.7-3 1.600-.7.800-1.200 2-1.100 3.200 1.200.1 2.400-.6 3.100-1.500z"/></svg>
        Войти через Apple
      </button>
    </div>

    <div id="signedIn" class="user hidden">
      <div class="who">
        <img id="avatar" class="avatar hidden" alt="">
        <div id="avatarFallback" class="avatar" aria-hidden="true">?</div>
        <div>
          <div class="name" id="userName"></div>
          <div class="mail" id="userEmail"></div>
        </div>
      </div>
      <div class="meta" id="userMeta"></div>
      <div class="notes">
        <h2>Мои заметки (хранятся в базе данных)</h2>
        <form class="add" id="addForm">
          <input id="noteText" type="text" maxlength="300" placeholder="Новая заметка" aria-label="Новая заметка" required>
          <button type="submit">Добавить</button>
        </form>
        <ul class="list" id="noteList"></ul>
        <div class="empty hidden" id="noteEmpty">Пока нет заметок.</div>
      </div>
      <button class="logout" id="logout">Выйти</button>
    </div>
  </section>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<script type="module">
/* Ключи Firebase (публичные, их можно хранить в репозитории). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAsbYDxbTMNdcQjrUI9_O6MNv9-vwjSNIc",
  authDomain: "psina-687b9.firebaseapp.com",
  projectId: "psina-687b9",
  appId: "1:117680586779:web:40adbc82306159f584b8be"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signOut, signInWithPopup,
  GoogleAuthProvider, GithubAuthProvider, OAuthProvider
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const msg = (text, ok = false) => { $("msg").textContent = text || ""; $("msg").className = "msg" + (ok ? " ok" : ""); };

/* ---------- Вход и выход ---------- */
async function signIn(provider) {
  msg("");
  const p = provider === "google" ? new GoogleAuthProvider()
          : provider === "github" ? new GithubAuthProvider()
          : new OAuthProvider("apple.com");
  try { await signInWithPopup(auth, p); }
  catch (e) { msg(e.message || String(e)); }
}

async function logout() {
  msg("");
  try { await signOut(auth); msg("Вы вышли из аккаунта.", true); }
  catch (e) { msg(e.message || String(e)); }
}

/* ---------- Заметки в Firestore: users/{uid}/notes ---------- */
let unsubNotes = null;

function renderNotes(items) {
  const ul = $("noteList"); ul.textContent = "";
  items.forEach(n => {
    const li = document.createElement("li");
    const t = document.createElement("span"); t.textContent = n.text;
    const b = document.createElement("button"); b.type = "button"; b.textContent = "Удалить";
    b.addEventListener("click", () => removeNote(n.id));
    li.append(t, b); ul.append(li);
  });
  $("noteEmpty").classList.toggle("hidden", items.length > 0);
}

function watchNotes(uid) {
  if (unsubNotes) { unsubNotes(); unsubNotes = null; }
  if (!uid) { renderNotes([]); return; }
  const q = query(collection(db, "users", uid, "notes"), orderBy("createdAt", "desc"));
  unsubNotes = onSnapshot(q,
    snap => renderNotes(snap.docs.map(d => ({ id: d.id, text: d.data().text }))),
    e => msg(e.message));
}

async function addNote(text) {
  if (!auth.currentUser) return;
  try { await addDoc(collection(db, "users", auth.currentUser.uid, "notes"), { text, createdAt: serverTimestamp() }); }
  catch (e) { msg(e.message || String(e)); }
}

async function removeNote(id) {
  if (!auth.currentUser) return;
  try { await deleteDoc(doc(db, "users", auth.currentUser.uid, "notes", id)); }
  catch (e) { msg(e.message || String(e)); }
}

/* ---------- Отображение ---------- */
function render(user) {
  $("signedOut").classList.toggle("hidden", !!user);
  $("signedIn").classList.toggle("hidden", !user);
  if (!user) return;
  const name = user.displayName || "Без имени";
  const provider = (user.providerData[0] && user.providerData[0].providerId || "").replace(".com", "");
  $("userName").textContent  = name;
  $("userEmail").textContent = user.email || "";
  $("userMeta").textContent  = "Вход выполнен через " + provider;
  $("avatarFallback").textContent = name.trim().charAt(0).toUpperCase();
  const img = $("avatar");
  if (user.photoURL) { img.src = user.photoURL; img.classList.remove("hidden"); $("avatarFallback").classList.add("hidden"); }
  else { img.classList.add("hidden"); $("avatarFallback").classList.remove("hidden"); }
}

/* ---------- Слушатели ---------- */
document.querySelectorAll(".prov").forEach(b => b.addEventListener("click", () => signIn(b.dataset.provider)));
$("logout").addEventListener("click", logout);
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const input = $("noteText"), text = input.value.trim();
  if (!text) return;
  input.value = "";
  await addNote(text);
});

onAuthStateChanged(auth, user => { render(user); watchNotes(user ? user.uid : null); });
</script>
</body>
</html>
