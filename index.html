<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silent Hill</title>
<link rel="icon" href="./images/file.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="./images/file.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1c1a; --bg-deep:#0b0c0b; --fog:#9a9c95; --paper:#b4b3a8; --paper-dark:#9b9a8f;
  --ink:#1d1e1b; --muted:#53554e; --line:#7f8077; --rust:#8a4630; --blood:#5a1d18; --ok:#a9b39a; --err:#d19b8c;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:#c4c4ba;
  font-family:"Courier Prime","Courier New",ui-monospace,monospace;
  background:
    radial-gradient(1000px 600px at 50% -10%, #3a3c38 0%, transparent 70%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);
  background-attachment:fixed;
  display:grid; place-items:center; padding:64px 20px;
}
/* зерно плёнки и виньетка */
body::before{
  content:""; position:fixed; inset:0; z-index:4; pointer-events:none; opacity:.22; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.2 -.1'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
}
body::after{
  content:""; position:fixed; inset:0; z-index:4; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%);
}
/* верхняя и нижняя ржавые линии */
.stripes{
  position:fixed; left:0; right:0; height:6px; z-index:5;
  background:linear-gradient(90deg,#2a2b28,var(--rust) 50%,#2a2b28);
  opacity:.55;
}
.stripes.top{top:0} .stripes.bottom{bottom:0}
main{width:100%; max-width:460px; position:relative; z-index:6}

.hero{position:relative; margin-bottom:26px; isolation:isolate}
.hero::before{
  content:""; position:absolute; z-index:-1; width:300px; height:220px; right:-60px; top:-70px;
  background:radial-gradient(closest-side, rgba(154,156,149,.22), transparent);
}
h1{
  margin:0 0 10px; font-family:"IM Fell English SC",Georgia,"Times New Roman",serif;
  font-weight:400; letter-spacing:.04em;
  font-size:clamp(2rem,9vw,3.1rem); line-height:1;
  color:#d2d1c6; text-shadow:0 0 22px rgba(0,0,0,.9), 2px 2px 0 var(--blood);
}
.lead{margin:0; color:#8e9088; line-height:1.55; max-width:36ch}

.panel{
  background:linear-gradient(180deg,var(--paper) 0%,var(--paper-dark) 100%);
  color:var(--ink); border:2px solid #3b3c38; border-radius:2px; padding:22px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.35), 0 0 0 5px #121311, 0 24px 60px rgba(0,0,0,.7);
}
.providers{display:grid; gap:12px}
.prov{
  font:inherit; font-weight:700; font-size:1rem; width:100%; text-align:left;
  display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;
  background:#c7c6bb; color:var(--ink); border:1px solid #2a2b28; border-radius:2px;
}
.prov:hover{background:#d1d0c5; border-color:var(--rust); box-shadow:inset 3px 0 0 var(--rust)}
.prov:active{box-shadow:none}
.prov:disabled{opacity:.55; cursor:wait}
.prov svg{width:22px; height:22px; flex:none; filter:grayscale(1) contrast(.9)}
.prov.apple{background:#1a1b19; color:#c4c4ba; border-color:#000}
.prov.apple:hover{background:#242522; border-color:var(--rust)}
:focus-visible{outline:2px solid var(--rust); outline-offset:3px}

.user{display:grid; gap:18px}
.who{display:flex; align-items:center; gap:14px}
.avatar{
  width:64px; height:64px; border-radius:50%; flex:none; object-fit:cover; background:#1d1e1b; color:var(--fog);
  border:2px solid #3b3c38; display:grid; place-items:center; filter:grayscale(.85) contrast(1.05);
  font-family:"IM Fell English SC",Georgia,serif; font-weight:400; font-size:1.9rem;
}
.name{font-family:"IM Fell English SC",Georgia,serif; font-weight:400; font-size:1.7rem; line-height:1.1; overflow-wrap:anywhere}
.mail{color:var(--muted); font-size:.92rem; overflow-wrap:anywhere}
.meta{font-size:.88rem; color:var(--muted); border-top:1px solid var(--line); padding-top:12px}

.notes{border-top:1px solid var(--line); padding-top:16px; display:grid; gap:12px}
.notes h2{margin:0; font-family:"IM Fell English SC",Georgia,serif; font-weight:400; font-size:1.3rem}
.add{display:flex; gap:8px}
.add input{flex:1; min-width:0; font:inherit; padding:11px 12px; border:1px solid #2a2b28; border-radius:2px; background:#d0cfc4; color:var(--ink)}
.add input::placeholder{color:#6b6d65}
.add button{font:inherit; font-weight:700; padding:0 18px; border-radius:2px; border:1px solid #2a2b28; background:#3a3c38; color:#cfcec3; cursor:pointer}
.add button:hover{background:var(--rust)}
.list{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.list li{display:flex; align-items:center; justify-content:space-between; gap:10px; background:#c9c8bd; border:1px solid var(--line); border-left:4px solid var(--rust); border-radius:2px; padding:10px 12px; overflow-wrap:anywhere}
.list li button{font:inherit; border:0; background:transparent; color:var(--blood); cursor:pointer; font-weight:700}
.list li button:hover{text-decoration:underline}
.empty{color:var(--muted); font-size:.9rem}
.logout{font:inherit; font-weight:700; padding:14px 16px; border-radius:2px; cursor:pointer; background:var(--blood); color:#d8d6cb; border:1px solid #2a0f0c}
.logout:hover{background:#74261f}

.msg{min-height:1.4em; margin:16px 2px 0; font-size:.92rem; color:var(--err); font-weight:700}
.msg.ok{color:var(--ok)}
.hidden{display:none !important}
@media (prefers-reduced-motion:no-preference){ .prov{transition:background .2s,box-shadow .2s,border-color .2s} }
</style>
</head>
<body>
<div class="stripes top" aria-hidden="true"></div>
<div class="stripes bottom" aria-hidden="true"></div>
<main>
  <header class="hero">
    <h1>Добро пожаловать в Silent Hill</h1>
    <p class="lead">Туман сгущается. Назови себя, чтобы войти, и твои записи будут ждать тебя.</p>
  </header>

  <section class="panel">
    <div id="signedOut" class="providers">
      <button class="prov" data-provider="google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>
        Войти через Google (Gmail)
      </button>
      <button class="prov" data-provider="github">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.700.5.500 5.700.5 12c0 5.100 3.300 9.400 7.900 10.900.6.100.8-.3.8-.6v-2c-3.200.7-3.900-1.500-3.900-1.500-.5-1.300-1.300-1.700-1.300-1.700-1-.7.100-.7.100-.7 1.200.1 1.800 1.200 1.800 1.200 1 1.800 2.800 1.300 3.400 1 .1-.8.4-1.300.7-1.600-2.600-.3-5.300-1.300-5.300-5.700 0-1.300.5-2.300 1.200-3.100-.1-.3-.5-1.500.1-3.100 0 0 1-.3 3.200 1.200a11 11 0 0 1 5.800 0C17.200 5.200 18.200 5.500 18.200 5.500c.6 1.600.2 2.800.1 3.100.8.800 1.200 1.800 1.200 3.100 0 4.400-2.700 5.400-5.300 5.700.4.400.8 1.100.8 2.200v3.300c0 .3.2.7.8.6A11.500 11.500 0 0 0 23.500 12C23.500 5.700 18.300.5 12 .5z"/></svg>
        Войти через GitHub
      </button>
      <button class="prov apple" data-provider="apple">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.400 12.700c0-2.400 2-3.500 2.100-3.600-1.200-1.700-3-1.900-3.600-2-1.500-.2-3 .9-3.800.9-.8 0-2-.9-3.300-.9-1.700 0-3.300 1-4.200 2.500-1.800 3.100-.5 7.700 1.300 10.200.9 1.200 1.900 2.600 3.200 2.500 1.300-.1 1.800-.8 3.300-.8s2 .8 3.300.8c1.400 0 2.300-1.200 3.100-2.500 1-1.400 1.400-2.800 1.400-2.900-.1 0-2.800-1.100-2.800-4.200zM13.900 5.300c.7-.9 1.200-2.100 1-3.300-1 0-2.300.7-3 1.600-.7.800-1.200 2-1.100 3.200 1.200.1 2.400-.6 3.100-1.500z"/></svg>
        Войти через Apple
      </button>
    </div>

    <div id="signedIn" class="user hidden">
      <div class="who">
        <img id="avatar" class="avatar hidden" alt="">
        <div id="avatarFallback" class="avatar" aria-hidden="true">?</div>
        <div>
          <div class="name" id="userName"></div>
          <div class="mail" id="userEmail"></div>
        </div>
      </div>
      <div class="meta" id="userMeta"></div>
      <div class="notes">
        <h2>Мои заметки (хранятся в базе данных)</h2>
        <form class="add" id="addForm">
          <input id="noteText" type="text" maxlength="300" placeholder="Новая заметка" aria-label="Новая заметка" required>
          <button type="submit">Добавить</button>
        </form>
        <ul class="list" id="noteList"></ul>
        <div class="empty hidden" id="noteEmpty">Пока нет заметок.</div>
      </div>
      <button class="logout" id="logout">Выйти</button>
    </div>
  </section>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<script type="module">
/* Ключи Firebase (публичные, их можно хранить в репозитории). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAsbYDxbTMNdcQjrUI9_O6MNv9-vwjSNIc",
  authDomain: "psina-687b9.firebaseapp.com",
  projectId: "psina-687b9",
  appId: "1:117680586779:web:40adbc82306159f584b8be"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signOut, signInWithPopup,
  GoogleAuthProvider, GithubAuthProvider, OAuthProvider,
  signInWithRedirect, getRedirectResult
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const msg = (text, ok = false) => { $("msg").textContent = text || ""; $("msg").className = "msg" + (ok ? " ok" : ""); };

/* ---------- Вход и выход ---------- */
const ERRORS = {
  "auth/cancelled-popup-request": "Окно входа было закрыто или запущено второй раз. Нажми кнопку один раз и дождись окна.",
  "auth/popup-closed-by-user": "Окно входа закрыто до завершения. Попробуй ещё раз.",
  "auth/account-exists-with-different-credential": "Этот email уже зарегистрирован через другой способ входа (например, Google). Войди через него.",
  "auth/unauthorized-domain": "Домен сайта не добавлен в Firebase: Authentication → Settings → Authorized domains.",
  "auth/operation-not-allowed": "Этот способ входа не включён в Firebase: Authentication → Sign-in method.",
  "auth/network-request-failed": "Нет связи с сервером. Проверь интернет."
};
const showError = e => msg(ERRORS[e && e.code] || (e && e.message) || String(e));

let signingIn = false;
const setBusy = busy => {
  signingIn = busy;
  document.querySelectorAll(".prov").forEach(b => b.disabled = busy);
};

function makeProvider(name) {
  if (name === "google") return new GoogleAuthProvider();
  if (name === "github") {
    const g = new GithubAuthProvider();
    g.addScope("user:email");
    return g;
  }
  return new OAuthProvider("apple.com");
}

async function signIn(name) {
  if (signingIn) return;          // защита от двойного клика
  setBusy(true);
  msg("");
  const p = makeProvider(name);
  try {
    await signInWithPopup(auth, p);
  } catch (e) {
    if (e.code === "auth/popup-blocked") {
      // браузер заблокировал попап: переходим на вход через редирект
      try { await signInWithRedirect(auth, p); return; }
      catch (e2) { showError(e2); }
    } else {
      showError(e);
    }
  } finally {
    setBusy(false);
  }
}

// результат входа через редирект (если был)
getRedirectResult(auth).catch(showError);

async function logout() {
  msg("");
  try { await signOut(auth); msg("Вы вышли из аккаунта.", true); }
  catch (e) { msg(e.message || String(e)); }
}

/* ---------- Заметки в Firestore: users/{uid}/notes ---------- */
let unsubNotes = null;

function renderNotes(items) {
  const ul = $("noteList"); ul.textContent = "";
  items.forEach(n => {
    const li = document.createElement("li");
    const t = document.createElement("span"); t.textContent = n.text;
    const b = document.createElement("button"); b.type = "button"; b.textContent = "Удалить";
    b.addEventListener("click", () => removeNote(n.id));
    li.append(t, b); ul.append(li);
  });
  $("noteEmpty").classList.toggle("hidden", items.length > 0);
}

function watchNotes(uid) {
  if (unsubNotes) { unsubNotes(); unsubNotes = null; }
  if (!uid) { renderNotes([]); return; }
  const q = query(collection(db, "users", uid, "notes"), orderBy("createdAt", "desc"));
  unsubNotes = onSnapshot(q,
    snap => renderNotes(snap.docs.map(d => ({ id: d.id, text: d.data().text }))),
    e => msg(e.message));
}

async function addNote(text) {
  if (!auth.currentUser) return;
  try { await addDoc(collection(db, "users", auth.currentUser.uid, "notes"), { text, createdAt: serverTimestamp() }); }
  catch (e) { msg(e.message || String(e)); }
}

async function removeNote(id) {
  if (!auth.currentUser) return;
  try { await deleteDoc(doc(db, "users", auth.currentUser.uid, "notes", id)); }
  catch (e) { msg(e.message || String(e)); }
}

/* ---------- Отображение ---------- */
function render(user) {
  $("signedOut").classList.toggle("hidden", !!user);
  $("signedIn").classList.toggle("hidden", !user);
  if (!user) return;
  const name = user.displayName || "Без имени";
  const provider = (user.providerData[0] && user.providerData[0].providerId || "").replace(".com", "");
  $("userName").textContent  = name;
  $("userEmail").textContent = user.email || "";
  $("userMeta").textContent  = "Вход выполнен через " + provider;
  $("avatarFallback").textContent = name.trim().charAt(0).toUpperCase();
  const img = $("avatar");
  if (user.photoURL) { img.src = user.photoURL; img.classList.remove("hidden"); $("avatarFallback").classList.add("hidden"); }
  else { img.classList.add("hidden"); $("avatarFallback").classList.remove("hidden"); }
}

/* ---------- Слушатели ---------- */
document.querySelectorAll(".prov").forEach(b => b.addEventListener("click", () => signIn(b.dataset.provider)));
$("logout").addEventListener("click", logout);
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const input = $("noteText"), text = input.value.trim();
  if (!text) return;
  input.value = "";
  await addNote(text);
});

onAuthStateChanged(auth, user => { render(user); watchNotes(user ? user.uid : null); });
</script>
</body>
</html>
